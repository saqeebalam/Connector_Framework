version: '3.8'
services:
  # Your existing MySQL service
  mysql:
    image: mysql:8.0
    container_name: demo-mysql-1
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: localdb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./init-db/mysql:/docker-entrypoint-initdb.d

  # ⚠️ Added Local Airflow Runner
  airflow:
    image: apache/airflow:2.7.2
    container_name: local-airflow
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./dags:/opt/airflow/dags            # Put your orchestrator python files here
      - ./target:/opt/airflow/apps           # Mounts your Spring Boot jar folder
      - C:/Java_Learn/Springboot/Connector_FrameWork/MYSQL/output              # Mounts your local output folder
    ports:
      - "8080:8080"                          # Airflow UI will be available at localhost:8080
    command: standalone                      # Runs Webserver, Scheduler, and DB in one command (perfect for local development)
